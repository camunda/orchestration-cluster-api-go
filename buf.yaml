# buf module configuration for the Zeebe gateway gRPC protocol.
#
# The proto is fetched from camunda/camunda (pinned to $SPEC_REF) into
# external-spec/proto/ by scripts/fetch-proto.sh, then compiled to Go stubs in pb/
# by `buf generate` (see buf.gen.yaml). Regenerate via `make generate`.
version: v2
modules:
  - path: external-spec/proto
lint:
  # The proto is vendored from upstream Zeebe and we do not control its style
  # (camelCase fields, unprefixed enum values, etc.), so we only apply MINIMAL
  # structural rules — and except the directory-match rule, since the file lives
  # under external-spec/proto/ rather than a package-named directory.
  use:
    - MINIMAL
  except:
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
