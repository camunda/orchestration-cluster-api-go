name: CI

on:
  push:
    branches: [main, "stable/**"]
  pull_request:
  schedule:
    # Run the complete suite daily against the default branch and current upstream API.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go vet (integration build)
        run: go vet -tags integration ./test/integration/...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Build the linter with the job's Go toolchain so its build version always
      # matches the module's Go version (avoids "linter built with older Go" errors).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Run golangci-lint
        run: golangci-lint run

  buf:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Install buf via npm (matching scripts/generate.sh's `npx @bufbuild/buf`)
      # rather than bufbuild/buf-action, whose GitHub-release binary download is a
      # recurring CI flake point during GitHub incidents and pulls in registry
      # push/setup surface we don't want for a lint-only job.
      - name: buf lint
        run: npx --yes @bufbuild/buf@1.72.0 lint

  examples:
    name: Examples & README sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The README code blocks are injected from examples/readme.go; building the
      # examples type-checks them, and --check fails if the README drifted.
      - name: Build examples
        run: go build ./examples/...
      - name: Check README snippets are in sync
        run: python scripts/sync-readme-snippets.py --check
      - name: Check example coverage
        run: python scripts/check-example-coverage.py
      # The generator fails on an exported type that is not assigned to a reference
      # page. Nothing ran it, so five merged PRs left it broken unnoticed.
      - name: Check every exported type is documented
        run: make docs-md

  commitlint:
    name: Commit messages
    # The commit-range linter is meaningful on pull requests; on direct pushes the
    # before/after range is degenerate, so scope it to PRs.
    if: github.event_name == 'pull_request'
    uses: camunda/sdk-infra/.github/workflows/sdk-commitlint.yml@v1

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: camunda/sdk-infra/actions/start-camunda@v1
        with:
          stack: simple
          docker-dir: docker
          max-attempts: 120
      - name: Camunda container logs
        if: always()
        run: docker logs camunda-engine --tail 400 || true
      - name: Integration tests
        env:
          CAMUNDA_REST_ADDRESS: http://localhost:8080
          CAMUNDA_GRPC_ADDRESS: localhost:26500
        run: go test -race -tags integration ./test/integration/...
      - name: Stop Camunda
        if: always()
        uses: camunda/sdk-infra/actions/stop-camunda@v1
        with:
          docker-dir: docker
          artifact-name: integration-docker-logs

  # Regenerates from upstream and reports drift without failing the run: routine upstream
  # spec churn must not turn the whole workflow red and mask a real regression in the jobs
  # above. Drift surfaces as a warning plus a patch artifact for a follow-up regen PR.
  #
  # Deliberately narrower than the sibling SDKs' job-level `continue-on-error: true`, which
  # also masks a genuinely broken codegen pipeline. Here only drift is tolerated — if
  # generate.sh itself fails, this job still fails.
  generation-drift:
    name: Generation drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The codegen pipeline needs Node (camunda-schema-bundler, openapi-generator-cli,
      # buf via npx), Java (openapi-generator is a Java tool), and Python (postprocess hooks).
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh upstream inputs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-proto.sh
          ./scripts/bundle-spec.sh
      - name: Regenerate and check for drift
        id: drift
        run: |
          chmod +x scripts/*.sh
          ./scripts/generate.sh
          if ! git diff --quiet; then
            echo 'drift=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Generated output drifts from committed sources (reporting only). Re-bundle and commit.'
            git diff --name-only | sed 's/^/CHANGED: /'
            git diff > _generation-drift.patch
          else
            echo 'drift=false' >> "$GITHUB_OUTPUT"
            echo 'No generation drift.'
          fi

      - name: Upload drift patch
        if: steps.drift.outputs.drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generation-drift
          path: _generation-drift.patch
