name: Release

# Releases are cut by semantic-release from the Conventional Commits merged to `main`
# or a `stable/**` branch (see release.config.cjs and the shared base config in
# @camunda8/sdk-infra): `fix`/`perf`/`revert` -> patch, `feat` -> minor. `main`
# publishes `-alpha.N` prereleases of the next line; `stable/N` publishes `N.x`.
#
# Go modules are consumed directly from a git tag (pkg.go.dev indexes the tag and
# `go get` resolves it), so there is no registry publish step: a release is the
# `vX.Y.Z` tag, a CHANGELOG.md commit and a GitHub Release.
#
# The SDK major tracks the Camunda server minor and Go requires majors >= 2 to
# carry a matching `/vN` module-path suffix. scripts/verify-release-major.sh runs
# as semantic-release's verifyRelease step, so a mismatched major stops the
# release before any tag is pushed.

on:
  push:
    branches:
      - main
      - "stable/**"
  workflow_dispatch:
    inputs:
      api_break_approved:
        description: >-
          Release even though the public API breaks compatibility with the last release on
          this stable branch (for breaks with no PR to label, e.g. from upstream spec drift).
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Build & test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  # Stable branches must not break customer code that compiled against the last release
  # of the major. This checks the commit about to be tagged, which includes generated
  # code from upstream spec changes that no PR reviewed. Override: the api-break-approved
  # label on any PR merged since that release, or the api_break_approved input of a
  # manual run. A no-op on main, whose prereleases make no compatibility promise.
  api-compat:
    name: API compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # find the PRs merged since the baseline and their labels
    steps:
      - uses: actions/checkout@v7
        if: startsWith(github.ref_name, 'stable/')
        with:
          # Tags are needed to list the commits since the baseline release.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        if: startsWith(github.ref_name, 'stable/')
        with:
          go-version-file: tools/apicompat/go.mod
          cache-dependency-path: |
            go.sum
            tools/apicompat/go.sum
      - name: Check API compatibility
        if: startsWith(github.ref_name, 'stable/')
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.api_break_approved }}
        run: |
          set -uo pipefail
          go -C tools/apicompat build -o "$RUNNER_TEMP/apicompat" . || exit 2
          # The newest published release of this stable major, not the nearest tag: a
          # stable branch is cut from main at an alpha.
          major="${GITHUB_REF_NAME#stable/}"
          version=$("$RUNNER_TEMP/apicompat" --print-baseline-major "$major") || exit 2
          # Newest stable tag git holds for this major; the proxy's list can lag a
          # just-pushed tag (golang/go#75191), so git is the cross-check.
          newest_tag=$(git tag --list "v${major}.*" --sort=-v:refname \
            | grep -E "^v${major}\.[0-9]+\.[0-9]+$" | head -n1 || true)
          if [ -z "$version" ]; then
            if [ -n "$newest_tag" ]; then
              echo "::error::Proxy lists no ${major}.x release but git has ${newest_tag}. Re-run once the proxy has indexed it."
              exit 2
            fi
            echo "::notice::No ${major}.x release published yet; nothing to compare against."
            exit 0
          fi
          tag="v${version}"
          git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || {
            echo "::error::Baseline ${version} has no ${tag} tag to list the PRs merged since."
            exit 2
          }
          # The proxy's version list can lag a just-pushed tag (golang/go#75191). If git
          # already has a newer stable tag for this major than the proxy returned, the
          # proxy baseline is stale: comparing against it could pass a change that breaks
          # the real latest release. Fail closed (a setup error) rather than guess.
          if [ -n "$newest_tag" ] && [ "$newest_tag" != "$tag" ]; then
            newest_version="${newest_tag#v}"
            higher=$(printf '%s\n%s\n' "$version" "$newest_version" | sort -V | tail -n1)
            if [ "$higher" = "$newest_version" ]; then
              echo "::error::Proxy baseline ${tag} is stale: git already has the newer tag ${newest_tag}. Re-run once the proxy has indexed it."
              exit 2
            fi
          fi
          echo "Baseline: ${tag}"
          pipeline_status=(0 0)
          "$RUNNER_TEMP/apicompat" --baseline-version "$version" | tee "$RUNNER_TEMP/apicompat.txt" || pipeline_status=("${PIPESTATUS[@]}")
          [ "${pipeline_status[1]}" -eq 0 ] || exit 2
          rc="${pipeline_status[0]}"
          {
            echo '## API compatibility'
            echo '```'
            cat "$RUNNER_TEMP/apicompat.txt" || exit 2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || exit 2
          [ "$rc" -eq 1 ] || exit "$rc"
          if [ "$DISPATCH_APPROVED" = "true" ]; then
            echo "::warning::Breaking API changes approved by the api_break_approved input of this run."
            exit 0
          fi
          approved=""
          merges=""
          # A reset or merged-back branch can reach the tag only through a second parent.
          tag_sha=$(git rev-parse --verify "${tag}^{commit}") || exit 2
          line=$(git rev-list --first-parent HEAD) || exit 2
          commits=""
          if grep -Fxq "$tag_sha" <<< "$line"; then
            commits=$(git log --first-parent --format=%H "${tag}..HEAD") || exit 2
          else
            echo "::notice::${tag} is not on the first-parent history of HEAD; no label can approve this release."
          fi
          while read -r sha; do
            [ -n "$sha" ] || continue
            prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
              --jq '.[] | select(.merged_at != null) | select(any(.labels[]; .name == "api-break-approved")) | [.number, .base.ref, .merge_commit_sha] | @tsv') || exit 2
            while IFS=$'\t' read -r number base merge; do
              if [ "$base" = "$GITHUB_REF_NAME" ] && [ -n "$merge" ] && grep -Fxq "$merge" <<< "$commits"; then
                approved="${approved} #${number}"
                merges="${merges}${merge} #${number}"$'\n'
              fi
            done <<< "$prs"
          done <<< "$commits"
          approved=$(echo "$approved" | xargs -n1 2>/dev/null | sort -u | xargs)
          if [ -z "$approved" ]; then
            echo "::error::Release blocked: the public API breaks compatibility with ${tag}. If intended, label the PR that made the change api-break-approved (or re-run this workflow manually with api_break_approved), then re-run."
            exit 1
          fi
          # An approval covers the API as of that PR's merge: breaks added after the newest
          # approved merge need their own approval. `git log` lists the newest first.
          latest=""
          latest_pr=""
          while read -r sha; do
            hit=$(grep -m1 "^${sha} " <<< "$merges" || true)
            if [ -n "$hit" ]; then
              latest="$sha"
              latest_pr="${hit#* }"
              break
            fi
          done <<< "$commits"
          if [ "$latest" != "$(git rev-parse HEAD)" ]; then
            git worktree add -q --detach "$RUNNER_TEMP/approved" "$latest" || exit 2
            since=0
            "$RUNNER_TEMP/apicompat" --baseline-dir "$RUNNER_TEMP/approved" || since=$?
            if [ "$since" -eq 1 ]; then
              echo "::error::Release blocked: breaking API changes were added after ${latest_pr} (${latest}), the newest approved PR. Label the PR that made them api-break-approved (or re-run this workflow manually with api_break_approved), then re-run."
              exit 1
            fi
            [ "$since" -eq 0 ] || exit "$since"
          fi
          echo "::warning::Breaking API changes approved with the api-break-approved label on: ${approved}"
          exit 0

  release:
    name: Version & release (${{ github.ref_name }})
    needs: [gate, api-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # mint GitHub OIDC token for Vault JWT auth
    steps:
      # semantic-release pushes the release commit to a ruleset-protected branch.
      # GITHUB_TOKEN can never bypass a ruleset, so it runs as camunda-sdk-automation,
      # which is a bypass actor on both rulesets.
      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure committer identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CAMUNDA_SDK_CURRENT_STABLE_MAJOR: ${{ vars.CAMUNDA_SDK_CURRENT_STABLE_MAJOR }}
        run: npx semantic-release
