name: Release

# Releases are cut by semantic-release from the Conventional Commits merged to `main`
# or a `stable/**` branch (see release.config.cjs and the shared base config in
# @camunda8/sdk-infra): `fix`/`perf`/`revert` -> patch, `feat` -> minor. `main`
# publishes `-alpha.N` prereleases of the next line; `stable/N` publishes `N.x`.
#
# Go modules are consumed directly from a git tag (pkg.go.dev indexes the tag and
# `go get` resolves it), so there is no registry publish step: a release is the
# `vX.Y.Z` tag, a CHANGELOG.md commit and a GitHub Release.
#
# The SDK major tracks the Camunda server minor and Go requires majors >= 2 to
# carry a matching `/vN` module-path suffix. scripts/verify-release-major.sh runs
# as semantic-release's verifyRelease step, so a mismatched major stops the
# release before any tag is pushed.

on:
  push:
    branches:
      - main
      - "stable/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Build & test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  release:
    name: Version & release (${{ github.ref_name }})
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # mint GitHub OIDC token for Vault JWT auth
    steps:
      # semantic-release pushes the release commit to a ruleset-protected branch.
      # GITHUB_TOKEN can never bypass a ruleset, so it runs as camunda-sdk-automation,
      # which is a bypass actor on both rulesets.
      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure committer identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CAMUNDA_SDK_CURRENT_STABLE_MAJOR: ${{ vars.CAMUNDA_SDK_CURRENT_STABLE_MAJOR }}
        run: npx semantic-release
