# Lightweight Camunda stack for SDK integration testing. A single Camunda
# service with an in-memory H2 database (RDBMS secondary storage), no
# Elasticsearch or Connectors. Authentication is disabled so the SDK connects
# with WithNoAuth().
#
# Configuration uses the Camunda 8.10 unified-configuration property names
# (camunda.data.secondary-storage.rdbms.*), mirroring the camunda monorepo's own
# H2 E2E setup. The pre-8.10 camunda.database.* / zeebe.broker.exporters.rdbms.*
# properties are gone in 8.10 — using them leaves the datasource URL unset and
# the broker never becomes healthy.
#
# Used by the `integration` CI job via camunda/sdk-infra/actions/start-camunda
# with `docker-dir: docker`. Run locally with:
#   docker compose -f docker/docker-compose.yaml up -d --wait
services:
  camunda:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.10-SNAPSHOT}
    container_name: camunda-engine
    environment:
      SPRING_PROFILES_ACTIVE: 'broker,consolidated-auth'
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: 'true'
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: 'false'
      CAMUNDA_DATA_SECONDARY_STORAGE_TYPE: 'rdbms'
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_URL: 'jdbc:h2:mem:cpt;DB_CLOSE_DELAY=-1;MODE=PostgreSQL'
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_USERNAME: 'sa'
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_PASSWORD: ''
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_AUTO_DDL: 'true'
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_FLUSH_INTERVAL: 'PT0S'
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_HISTORY_DEFAULT_HISTORY_TTL: 'PT60S'
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_HISTORY_MIN_HISTORY_CLEANUP_INTERVAL: 'PT10S'
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_HISTORY_MAX_HISTORY_CLEANUP_INTERVAL: 'PT60S'
    ports:
      - '8080:8080'
      - '26500:26500'
      - '9600:9600'
    healthcheck:
      test: ['CMD', 'wget', '-qO', '-', 'http://localhost:9600/actuator/health/status']
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - camunda-net

networks:
  camunda-net:
    name: camunda-net
